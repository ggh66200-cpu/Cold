<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARAMKY Pro | النظام الحر والمطور</title>
    <style>
        :root { 
            --bg-main: #0f172a; --card-bg: #1e293b; --border-clr: #334155; 
            --text-main: #f8fafc; --text-sec: #94a3b8; --gold: #d4af37; 
            --blue-btn: #0284c7; --green-btn: #16a34a; --red-btn: #dc2626;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Cairo', system-ui, sans-serif; background-color: var(--bg-main); color: var(--text-main); margin: 0; padding: 6px; direction: rtl; }
        .container { max-width: 480px; margin: auto; background: var(--card-bg); padding: 10px; border-radius: 12px; border: 1px solid var(--border-clr); box-shadow: 0 8px 20px rgba(0,0,0,0.6); }
        
        #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--gold); color: #000; padding: 8px 16px; border-radius: 20px; font-weight: bold; font-size: 11px; z-index: 10000; transition: transform 0.3s; }
        #toast.show { transform: translateX(-50%) translateY(0); }

        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-clr); padding-bottom: 6px; margin-bottom: 8px; }
        .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 10px; background: #0b0f19; padding: 4px; border-radius: 8px; }
        .tab-btn { background: transparent; border: none; color: var(--text-sec); font-size: 9px; font-weight: bold; padding: 6px 2px; border-radius: 6px; cursor: pointer; text-align: center; }
        .tab-btn.active { background: var(--gold); color: #000; }

        .section { display: none; }
        .section.active { display: block; animation: fadeIn 0.2s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .form-group { margin-bottom: 8px; }
        label { display: block; font-size: 10px; margin-bottom: 2px; color: var(--text-sec); }
        input, select, textarea { width: 100%; padding: 7px; background: #0f172a; border: 1px solid var(--border-clr); color: white; border-radius: 6px; font-size: 11px; }
        input:focus { border-color: var(--gold); outline: none; }

        .btn { background: var(--blue-btn); color: white; font-weight: bold; border: none; width: 100%; padding: 8px; border-radius: 6px; cursor: pointer; font-size: 11px; margin-top: 4px; }
        .btn-gold { background: linear-gradient(135deg, #d4af37, #aa7c11); color: #000; }
        .btn-green { background: var(--green-btn); color: white; }
        .btn-red { background: var(--red-btn); color: white; }
        .btn-sm { width: auto; padding: 3px 8px; font-size: 9px; display: inline-block; }

        .card { background: #0b0f19; padding: 8px; border-radius: 8px; margin-bottom: 6px; border: 1px solid var(--border-clr); }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 999; justify-content: center; align-items: center; }
        .modal-content { background: var(--card-bg); padding: 16px; border-radius: 10px; width: 280px; border: 1px solid var(--gold); }
    </style>
</head>
<body>
    <div id="toast">تم التنفيذ بنجاح</div>

    <div class="container">
        <div class="header">
            <div>
                <h2 style="color: var(--gold); font-size: 13px; margin: 0;">ARAMKY Pro (الحر)</h2>
                <div style="font-size: 9px; color: var(--text-sec);">إدارة تداول ومخازن الذهب بكل حرية</div>
            </div>
            <button class="btn btn-gold btn-sm" onclick="openPinModal()">🔑 دخول التاجر</button>
        </div>

        <!-- أزرار التنقل -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('store', this)">🛍️ المتجر</button>
            <button class="tab-btn" onclick="switchTab('inventory', this)">📦 المخزن</button>
            <button class="tab-btn" onclick="switchTab('calc', this)">🧮 الحاسبة</button>
            <button class="tab-btn" onclick="switchTab('crm', this)">👥 الديون</button>
        </div>

        <!-- 1️⃣ قسم المتجر الحر (نشر، تعديل، حذف، وتفاعل) -->
        <div id="section-store" class="section active">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                <h4 style="color:var(--gold); margin:0; font-size:11px;">عرض القطع في المتجر</h4>
                <button class="btn btn-gold btn-sm merchant-only" style="display:none;" onclick="openStoreModal(null)">+ إضافة قطعة</button>
            </div>
            <div class="form-group"><input type="text" id="store-search" placeholder="ابحث في المتجر..." oninput="renderStore()"></div>
            <div id="store-list"></div>
        </div>

        <!-- 2️⃣ قسم المخزن الحر (إدارة وتحديث فوري) -->
        <div id="section-inventory" class="section">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                <h4 style="color:var(--gold); margin:0; font-size:11px;">المخزن والباركود</h4>
                <button class="btn btn-gold btn-sm merchant-only" style="display:none;" onclick="openInvModal(null)">+ إضافة للمخزن</button>
            </div>
            <div class="form-group"><input type="text" id="inv-search" placeholder="ابحث في المخزن..." oninput="renderInventory()"></div>
            <div id="inv-list"></div>
        </div>

        <!-- 3️⃣ حاسبة أرامكي الحرّة -->
        <div id="section-calc" class="section">
            <h4 style="color:var(--gold); margin:0 0 6px 0; font-size:11px;">حاسبة أرامكي الذكية</h4>
            <div class="form-group"><label>سعر المثقال (د.ع):</label><input type="number" id="c-mithqal" value="1250000" oninput="runCalc()"></div>
            <div class="form-group"><label>سعر 100$ (الورق):</label><input type="number" id="c-usd" value="153000" oninput="runCalc()"></div>
            <div class="form-group"><label>الوزن (غرام):</label><input type="number" id="c-weight" value="10" oninput="runCalc()"></div>
            <div class="form-group"><label>أجور الصياغة / غرام:</label><input type="number" id="c-wage" value="25000" oninput="runCalc()"></div>
            <div style="background:#0b0f19; padding:8px; border-radius:6px; text-align:center; margin-top:6px;">
                <div style="font-size:10px; color:var(--text-sec);">الإجمالي بالدينار:</div>
                <div style="font-size:14px; font-weight:bold; color:var(--gold);" id="c-total">0 د.ع</div>
                <div style="font-size:10px; color:#4ade80;" id="c-paper">بالورق: 0</div>
            </div>
        </div>

        <!-- 4️⃣ قسم الديون والـ CRM -->
        <div id="section-crm" class="section">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                <h4 style="color:var(--gold); margin:0; font-size:11px;">إدارة الديون</h4>
                <button class="btn btn-gold btn-sm merchant-only" style="display:none;" onclick="openCrmModal()">+ إضافة ذمة</button>
            </div>
            <div id="crm-list"></div>
        </div>
    </div>

    <!-- نافذة إضافة/تعديل المتجر -->
    <div class="modal" id="storeModal">
        <div class="modal-content">
            <h3 style="color:var(--gold); margin-top:0; font-size:12px;">إدارة قطعة المتجر</h3>
            <input type="hidden" id="s-id">
            <div class="form-group"><input type="text" id="s-title" placeholder="اسم القطعة"></div>
            <div class="form-group"><input type="number" id="s-price" placeholder="السعر الإجمالي (د.ع)"></div>
            <div class="form-group"><textarea id="s-notes" placeholder="ملاحظات والتفاصيل..."></textarea></div>
            <button class="btn btn-green" onclick="saveStoreItem()">حفظ ونشر</button>
            <button class="btn" style="background:#4b5563; margin-top:4px;" onclick="closeModals()">إلغاء</button>
        </div>
    </div>

    <!-- نافذة إضافة/تعديل المخزن -->
    <div class="modal" id="invModal">
        <div class="modal-content">
            <h3 style="color:var(--gold); margin-top:0; font-size:12px;">إدارة المخزن</h3>
            <input type="hidden" id="i-id">
            <div class="form-group"><input type="text" id="i-name" placeholder="اسم الصنف"></div>
            <div class="form-group"><input type="text" id="i-weight" placeholder="الوزن (غرام)"></div>
            <div class="form-group"><input type="number" id="i-qty" placeholder="الكمية المتوفرة"></div>
            <button class="btn btn-green" onclick="saveInvItem()">حفظ في المخزن</button>
            <button class="btn" style="background:#4b5563; margin-top:4px;" onclick="closeModals()">إلغاء</button>
        </div>
    </div>

    <!-- نافذة رمز الدخول -->
    <div class="modal" id="pinModal">
        <div class="modal-content text-center">
            <h3 style="color:var(--gold); margin-top:0; font-size:12px;">دخول التاجر والصايغ</h3>
            <input type="password" id="pinCode" placeholder="أدخل الرمز (7777)" style="text-align:center; margin-bottom:8px;">
            <button class="btn btn-gold" onclick="verifyPin()">دخول كامل الصلاحيات</button>
            <button class="btn" style="background:#4b5563; margin-top:4px;" onclick="closeModals()">إلغاء</button>
        </div>
    </div>

    <script>
        function showToast(msg) {
            let t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2500);
        }

        let isMerchant = false;

        // قواعد بيانات ديناميكية بالكامل وقابلة للتعديل والحذف فوراً
        let storeData = [
            { id: 1, title: "محبس عيار 21 ملكي", price: 2640960, notes: "وزن 4.8 غرام - متوفر بالمتجر" }
        ];

        let invData = [
            { id: 1, name: "غويشة عيار 21", weight: "14.8غ", qty: 3 }
        ];

        let crmData = [
            { id: 1, name: "أحمد حواش", amount: "157,245 د.ع" }
        ];

        function switchTab(id, el) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('section-' + id).classList.add('active');
            el.classList.add('active');
            if(id === 'store') renderStore();
            if(id === 'inventory') renderInventory();
            if(id === 'crm') renderCrm();
        }

        function renderStore() {
            let q = document.getElementById('store-search').value.toLowerCase();
            let c = document.getElementById('store-list');
            c.innerHTML = '';
            storeData.filter(x => x.title.toLowerCase().includes(q)).forEach(item => {
                c.innerHTML += `
                    <div class="card">
                        <div style="font-weight:bold; color:var(--gold); font-size:12px;">${item.title}</div>
                        <div style="color:#4ade80; font-size:11px; margin:2px 0;">السعر: ${item.price.toLocaleString()} د.ع</div>
                        <div style="color:var(--text-sec); font-size:10px;">${item.notes}</div>
                        ${isMerchant ? `
                            <div style="margin-top:6px; display:flex; gap:4px;">
                                <button class="btn btn-gold btn-sm" onclick="openStoreModal(${item.id})">تعديل</button>
                                <button class="btn btn-red btn-sm" onclick="deleteStore(${item.id})">حذف</button>
                            </div>
                        ` : ''}
                    </div>
                `;
            });
        }

        function renderInventory() {
            let q = document.getElementById('inv-search').value.toLowerCase();
            let c = document.getElementById('inv-list');
            c.innerHTML = '';
            invData.filter(x => x.name.toLowerCase().includes(q)).forEach(item => {
                c.innerHTML += `
                    <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
                        <div>
                            <div style="font-weight:bold; font-size:11px;">${item.name} (${item.weight})</div>
                            <div style="color:var(--text-sec); font-size:10px;">الكمية: ${item.qty}</div>
                        </div>
                        ${isMerchant ? `
                            <div>
                                <button class="btn btn-gold btn-sm" onclick="openInvModal(${item.id})">تعديل</button>
                                <button class="btn btn-red btn-sm" onclick="deleteInv(${item.id})">حذف</button>
                            </div>
                        ` : ''}
                    </div>
                `;
            });
        }

        function renderCrm() {
            let c = document.getElementById('crm-list');
            c.innerHTML = crmData.map(d => `
                <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
                    <span>👤 <b>${d.name}</b> - <span style="color:#f87171;">${d.amount}</span></span>
                    ${isMerchant ? `<button class="btn btn-green btn-sm" onclick="showToast('تم السداد بنجاح')">سداد</button>` : ''}
                </div>
            `).join('');
        }

        // عمليات التعديل والحذف المباشرة
        function openStoreModal(id) {
            document.getElementById('storeModal').style.display = 'flex';
            if(id) {
                let item = storeData.find(x => x.id === id);
                document.getElementById('s-id').value = item.id;
                document.getElementById('s-title').value = item.title;
                document.getElementById('s-price').value = item.price;
                document.getElementById('s-notes').value = item.notes;
            } else {
                document.getElementById('s-id').value = '';
                document.getElementById('s-title').value = '';
                document.getElementById('s-price').value = '';
                document.getElementById('s-notes').value = '';
            }
        }

        function saveStoreItem() {
            let id = document.getElementById('s-id').value;
            let title = document.getElementById('s-title').value;
            let price = parseFloat(document.getElementById('s-price').value) || 0;
            let notes = document.getElementById('s-notes').value;
            if(!title) { showToast('أدخل عنوان القطعة'); return; }

            if(id) {
                let item = storeData.find(x => x.id == id);
                item.title = title; item.price = price; item.notes = notes;
                showToast('تم التعديل بنجاح');
            } else {
                storeData.push({ id: Date.now(), title, price, notes });
                showToast('تم النشر بنجاح');
            }
            closeModals();
            renderStore();
        }

        function deleteStore(id) {
            storeData = storeData.filter(x => x.id !== id);
            showToast('تم الحذف');
            renderStore();
        }

        function openInvModal(id) {
            document.getElementById('invModal').style.display = 'flex';
            if(id) {
                let item = invData.find(x => x.id === id);
                document.getElementById('i-id').value = item.id;
                document.getElementById('i-name').value = item.name;
                document.getElementById('i-weight').value = item.weight;
                document.getElementById('i-qty').value = item.qty;
            } else {
                document.getElementById('i-id').value = '';
                document.getElementById('i-name').value = '';
                document.getElementById('i-weight').value = '';
                document.getElementById('i-qty').value = 1;
            }
        }

        function saveInvItem() {
            let id = document.getElementById('i-id').value;
            let name = document.getElementById('i-name').value;
            let weight = document.getElementById('i-weight').value;
            let qty = parseInt(document.getElementById('i-qty').value) || 0;
            if(!name) { showToast('أدخل اسم الصنف'); return; }

            if(id) {
                let item = invData.find(x => x.id == id);
                item.name = name; item.weight = weight; item.qty = qty;
                showToast('تم تحديث المخزن');
            } else {
                invData.push({ id: Date.now(), name, weight, qty });
                showToast('تمت الإضافة للمخزن');
            }
            closeModals();
            renderInventory();
        }

        function deleteInv(id) {
            invData = invData.filter(x => x.id !== id);
            showToast('تم الحذف من المخزن');
            renderInventory();
        }

        function runCalc() {
            let m = parseFloat(document.getElementById('c-mithqal').value) || 0;
            let u = parseFloat(document.getElementById('c-usd').value) || 0;
            let w = parseFloat(document.getElementById('c-weight').value) || 0;
            let wage = parseFloat(document.getElementById('c-wage').value) || 0;
            let total = ((m / 5) + wage) * w;
            let papers = Math.floor(total / u);
            document.getElementById('c-total').innerText = Math.round(total).toLocaleString() + " د.ع";
            document.getElementById('c-paper').innerText = "بالورق: " + papers + " ورقة";
        }

        function openPinModal() { document.getElementById('pinModal').style.display = 'flex'; }
        function closeModals() { document.querySelectorAll('.modal').forEach(m => m.style.display = 'none'); }
        
        function verifyPin() {
            if(document.getElementById('pinCode').value === "7777") {
                isMerchant = true;
                document.querySelectorAll('.merchant-only').forEach(el => el.style.display = 'inline-block');
                closeModals();
                showToast('تم تفعيل صلاحيات التحكم الحر!');
                renderStore();
                renderInventory();
                renderCrm();
            } else {
                showToast('الرمز خطأ!');
            }
        }

        window.onload = () => { runCalc(); renderStore(); };
    </script>
</body>
</html>
